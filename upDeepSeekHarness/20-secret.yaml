# dsh pod instance — Secret (PLACEHOLDER — 等 kstsai/dsh1 送 key)
#
# ⚠️ 目前值是 placeholder，不要拿去做 LLM 驗證。
# key 一到，用下面指令注入（不要直接 edit 本檔 commit 真 key）：
#
#   kubectl patch secret dsh-api-key -n dsh --type merge \
#     -p '{"stringData":{"DEEPSEEK_API_KEY":"<REAL_KEY>"}}'
#   kubectl rollout restart deployment/dsh-web -n dsh
#
# 驗證注入成功（值不會明文顯示，看長度）：
#   kubectl get secret dsh-api-key -n dsh -o jsonpath='{.data.DEEPSEEK_API_KEY}' | wc -c
apiVersion: v1
kind: Secret
metadata:
  name: dsh-api-key
  namespace: dsh
  labels:
    app: dsh
    protected: "true"
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "REPLACE_ME_WHEN_KEY_ARRIVES"
