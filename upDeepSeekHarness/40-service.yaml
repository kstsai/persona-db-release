# dsh pod instance — Service (NodePort)
# 暴露 dsh Web UI 3080 → http://lzc:<nodePort>/ 可直接連
# nodePort 省略讓 k8s 自動分配（30000-32767）— 避免固定值衝突（30080 被 Gitea 佔用）
apiVersion: v1
kind: Service
metadata:
  name: dsh-web
  namespace: dsh
  labels:
    app: dsh
    protected: "true"
  annotations:
    lzc-cp/protected: "true"
spec:
  type: NodePort
  selector:
    app: dsh
  ports:
    - name: web
      port: 3080
      targetPort: 3080
